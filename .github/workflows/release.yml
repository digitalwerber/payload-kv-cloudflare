name: Release

# A published GitHub release vX.Y.Z publishes version X.Y.Z to npm via Trusted Publishing:
# no npm token, provenance comes automatically. Build and publish are separate jobs, so code
# from dependencies (install, build, pack) never runs with the OIDC token.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Pinned to commits: the output of this job gets published
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      # Only what went through a PR to main gets published, whatever the release points to
      - name: Release commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Tag matches package.json
        run: test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
      - run: pnpm build
      # pnpm pack applies publishConfig (exports from dist/)
      - run: pnpm pack --out package.tgz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: package
          path: package.tgz

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC for npm Trusted Publishing
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted Publishing needs npm >= 11.5.1, newer than the one bundled with Node 24; pinned
      # because this job holds the OIDC token
      - run: npm install -g npm@11.21.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: package
      # npm requires a dist-tag other than latest for prerelease versions
      - run: npm publish package.tgz --access public --tag ${{ github.event.release.prerelease && 'next' || 'latest' }}
